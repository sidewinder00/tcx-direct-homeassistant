name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check aiohttp pytest ruff

      - name: Check formatting
        run: ruff format --check custom_components/tcx_direct tests

      - name: Lint integration and tests
        run: ruff check custom_components/tcx_direct tests

      - name: Run unit tests
        run: pytest -q

      - name: Compile integration
        run: python -m compileall -q custom_components/tcx_direct

      - name: Validate JSON files
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/tcx_direct/manifest.json >/dev/null
          python -m json.tool custom_components/tcx_direct/strings.json >/dev/null
          python -m json.tool custom_components/tcx_direct/translations/en.json >/dev/null

      - name: Verify release metadata consistency
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("custom_components/tcx_direct/manifest.json").read_text())
          strings = json.loads(Path("custom_components/tcx_direct/strings.json").read_text())
          english = json.loads(Path("custom_components/tcx_direct/translations/en.json").read_text())
          tree = ast.parse(Path("custom_components/tcx_direct/const.py").read_text())
          const_version = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "VERSION":
                          const_version = ast.literal_eval(node.value)
          readme_match = re.search(
              r"^\*\*v(\d+\.\d+\.\d+)\*\*$",
              Path("README.md").read_text(),
              re.MULTILINE,
          )
          changelog_match = re.search(
              r"^## \[(\d+\.\d+\.\d+)\]",
              Path("CHANGELOG.md").read_text(),
              re.MULTILINE,
          )
          versions = {
              "const.py": const_version,
              "manifest.json": manifest.get("version"),
              "README.md": readme_match.group(1) if readme_match else None,
              "CHANGELOG.md": changelog_match.group(1) if changelog_match else None,
          }
          if len(set(versions.values())) != 1 or None in versions.values():
              raise SystemExit(
                  "Release version mismatch: "
                  + ", ".join(f"{path}={version!r}" for path, version in versions.items())
              )
          if strings != english:
              raise SystemExit("strings.json and translations/en.json do not match")
          print(f"TCX Direct version {const_version} and English translations are consistent")
          PY

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@master
