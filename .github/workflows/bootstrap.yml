name: Bootstrap TCX Direct source

on:
  push:
    paths:
      - .bootstrap/ready

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/tcx_direct_v0.1.5.zip.b64.* | base64 --decode > /tmp/tcx_direct_v0.1.5.zip
          rm -rf /tmp/tcx-direct
          mkdir -p /tmp/tcx-direct
          unzip -q /tmp/tcx_direct_v0.1.5.zip -d /tmp/tcx-direct
          rm -rf custom_components/tcx_direct
          cp -a /tmp/tcx-direct/custom_components/tcx_direct custom_components/tcx_direct
          rm -rf custom_components/tcx_direct/__pycache__

      - name: Point integration metadata at canonical repository
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("custom_components/tcx_direct/manifest.json")
          data = json.loads(path.read_text())
          data["documentation"] = "https://github.com/sidewinder00/tcx-direct-homeassistant"
          data["issue_tracker"] = "https://github.com/sidewinder00/tcx-direct-homeassistant/issues"
          data["codeowners"] = ["@sidewinder00"]
          path.write_text(json.dumps(data, indent=2) + "\n")

      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit published source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Jandy TCX Direct v0.1.5 source"
          git push
